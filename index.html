<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MR GOT Tracking</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ── WHITE & RED THEME ───────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#f5f5f5}::-webkit-scrollbar-thumb{background:#e11d48;border-radius:3px;opacity:.5}

/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#fff 0%,#fff1f2 100%)}
.auth-box{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:400px;border-top:4px solid #e11d48;box-shadow:0 8px 32px rgba(225,29,72,.12)}
.auth-logo{font-size:28px;font-weight:800;color:#e11d48;text-align:center;margin-bottom:4px;letter-spacing:.5px}
.auth-sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:28px}
.auth-tabs{display:flex;background:#fff1f2;border-radius:8px;padding:3px;margin-bottom:20px}
.auth-tab{flex:1;padding:8px;border:none;background:transparent;color:#9f1239;cursor:pointer;border-radius:6px;font-weight:600;font-size:13px;font-family:inherit}
.auth-tab.active{background:#e11d48;color:#fff;box-shadow:0 2px 8px rgba(225,29,72,.3)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:#9f1239;text-transform:uppercase;margin-bottom:5px;letter-spacing:.4px}
.field input,.field select{width:100%;background:#fff;border:1.5px solid #fecdd3;border-radius:8px;color:#1a1a1a;padding:10px 12px;font-size:14px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:#e11d48;box-shadow:0 0 0 3px rgba(225,29,72,.1)}
.btn-primary{width:100%;background:#e11d48;border:none;color:#fff;border-radius:8px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:4px;letter-spacing:.3px}
.btn-primary:hover{background:#be123c}
.auth-err{color:#be123c;font-size:12px;text-align:center;margin-top:10px;min-height:18px}

/* APP */
#app-screen{display:none;min-height:100vh;background:#fafafa}
#topbar{background:#e11d48;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:0 2px 12px rgba(225,29,72,.3)}
#topbar h1{font-size:16px;font-weight:800;color:#fff;letter-spacing:.5px}
.topbar-right{display:flex;align-items:center;gap:12px}
.user-name{font-size:13px;font-weight:600;color:#fff}
.user-role{font-size:11px;color:#fda4af;margin-top:1px}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.btn-logout:hover{background:rgba(255,255,255,.25)}

/* NAV */
#nav{display:flex;gap:2px;background:#fff;padding:0 16px;border-bottom:2px solid #fecdd3;overflow-x:auto;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.nav-btn{padding:12px 16px;border:none;border-radius:0;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;font-family:inherit;transition:all .15s;border-bottom:3px solid transparent;margin-bottom:-2px}
.nav-btn.active{background:#fff;color:#e11d48;border-bottom-color:#e11d48}
.nav-btn:not(.active){background:transparent;color:#64748b}
.nav-btn:hover:not(.active){color:#e11d48;background:#fff1f2}
.nav-badge{background:#e11d48;color:#fff;border-radius:99px;font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700}

/* CONTENT */
#content{padding:16px;max-width:1100px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;border:1px solid #fecdd3;box-shadow:0 1px 4px rgba(225,29,72,.06)}
.section-title{font-size:12px;font-weight:700;color:#e11d48;text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.section-title::after{content:'';flex:1;height:1px;background:#fecdd3}

/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label.lbl{font-size:11px;color:#9f1239;font-weight:700;text-transform:uppercase;display:block;margin-bottom:4px;letter-spacing:.3px}
input.inp,select.inp,textarea.inp{background:#fff;border:1.5px solid #fecdd3;border-radius:6px;color:#1a1a1a;padding:7px 10px;width:100%;font-size:13px;font-family:inherit}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:#e11d48;box-shadow:0 0 0 3px rgba(225,29,72,.08)}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:8px}
.search-inp{background:#fff;border:2px solid #e11d48;border-radius:8px;color:#1a1a1a;padding:10px 36px 10px 14px;width:100%;font-size:14px;font-family:inherit}
.search-inp:focus{outline:none;box-shadow:0 0 0 3px rgba(225,29,72,.15)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#fda4af;cursor:pointer;font-size:18px}
.dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid #fecdd3;border-top:none;border-radius:0 0 10px 10px;z-index:100;max-height:320px;overflow-y:auto;box-shadow:0 8px 24px rgba(225,29,72,.1);display:none}
.drop-item{padding:9px 12px;border-bottom:1px solid #fff1f2;cursor:pointer;display:flex;align-items:flex-start;gap:8px;transition:background .1s}
.drop-item:hover{background:#fff1f2}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.drop-desc{font-size:13px;line-height:1.4;flex:1;color:#1a1a1a}
.drop-meta{font-size:11px;color:#94a3b8;margin-top:2px}
mark{background:#fda4af;padding:0 1px;color:#7f1d1d;border-radius:2px}

/* CAT PILLS */
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cat-pill{padding:4px 10px;border-radius:20px;border:1px solid currentColor;background:transparent;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:all .15s}
.cat-pill:hover{opacity:.8}
.cat-pill.active{color:#fff!important}

/* CART */
.cart-hdr{display:grid;grid-template-columns:28px 1fr 110px 110px 60px 150px 36px;gap:8px;align-items:center;padding:8px 12px;background:#e11d48;border-radius:8px 8px 0 0;margin-bottom:0}
.cart-hdr span{font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.4px}
.cart-row{display:grid;grid-template-columns:28px 1fr 110px 110px 60px 150px 36px;gap:8px;align-items:center;padding:10px 12px;background:#fff;border:1px solid #fecdd3;border-top:none;margin-bottom:0}
.cart-row:last-of-type{border-radius:0 0 8px 8px}
.cart-row:hover{background:#fff1f2}
.cart-desc{font-size:12px;font-weight:600;color:#1a1a1a}
.cart-meta-sm{font-size:10px;color:#94a3b8;margin-top:2px}
.seq{font-size:11px;color:#fda4af;font-weight:700}
.qty-inp{width:60px;background:#fff;border:1.5px solid #fecdd3;border-radius:5px;color:#1a1a1a;padding:5px 6px;font-size:13px;text-align:center;font-family:inherit}
.rmk-inp{width:100%;background:#fff;border:1.5px solid #fecdd3;border-radius:5px;color:#1a1a1a;padding:5px 8px;font-size:12px;font-family:inherit}
.qty-inp:focus,.rmk-inp:focus{outline:none;border-color:#e11d48}
.del-btn{background:#fff1f2;border:1px solid #fecdd3;color:#e11d48;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:14px}
.del-btn:hover{background:#e11d48;color:#fff}
.unit-cell{font-size:12px;color:#94a3b8;text-align:center}
.action-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn-submit{flex:1;min-width:140px;background:#e11d48;border:none;color:#fff;border-radius:8px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(225,29,72,.25)}
.btn-submit:hover{background:#be123c}
.btn-excel{flex:1;min-width:140px;background:#15803d;border:none;color:#fff;border-radius:8px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-excel:hover{background:#166534}
.btn-print{flex:1;min-width:140px;background:#1e40af;border:none;color:#fff;border-radius:8px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-print:hover{background:#1d4ed8}
.btn-danger{background:#e11d48;border:none;color:#fff;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.btn-danger:hover{background:#be123c}
.btn-green{background:#15803d;border:none;color:#fff;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.btn-green:hover{background:#166534}
.btn-blue{background:#1e40af;border:none;color:#fff;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.btn-blue:hover{background:#1d4ed8}
.btn-gray{background:#fff;border:1.5px solid #fecdd3;color:#9f1239;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.btn-gray:hover{background:#fff1f2}
.btn-sm{padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.btn-sm-yellow{background:#e11d48;color:#fff}
.btn-sm-yellow:hover{background:#be123c}
.btn-sm-red{background:#be123c;color:#fff}
.btn-sm-red:hover{background:#9f1239}
.btn-sm-green{background:#15803d;color:#fff}
.btn-sm-green:hover{background:#166534}
.btn-sm-blue{background:#1e40af;color:#fff}
.btn-sm-blue:hover{background:#1d4ed8}
.btn-sm-gray{background:#fff;border:1px solid #fecdd3;color:#9f1239}
.btn-sm-gray:hover{background:#fff1f2}

/* MR CARDS */
.mr-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:8px;border:1px solid #fecdd3;border-left:4px solid #fecdd3;cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(225,29,72,.06)}
.mr-card:hover{box-shadow:0 4px 16px rgba(225,29,72,.12);transform:translateY(-1px);border-color:#fda4af}
.mr-card.pending{border-left-color:#f97316}
.mr-card.approved{border-left-color:#15803d}
.mr-card.rejected{border-left-color:#e11d48}
.mr-card.fulfilled{border-left-color:#7c3aed}
.mr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mr-num{font-size:14px;font-weight:700;color:#1a1a1a}
.mr-info{font-size:12px;color:#94a3b8;margin-top:3px}
.status-badge{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;flex-shrink:0;text-transform:uppercase}
.s-pending{background:#fef3c7;color:#92400e}
.s-approved{background:#dcfce7;color:#14532d}
.s-rejected{background:#fff1f2;color:#9f1239}
.s-fulfilled{background:#ede9fe;color:#4c1d95}

/* INVENTORY */
.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.unit-card{background:#fff;border-radius:10px;padding:14px;cursor:pointer;border:2px solid #fecdd3;transition:all .15s;box-shadow:0 1px 4px rgba(225,29,72,.06)}
.unit-card:hover{border-color:#e11d48;box-shadow:0 4px 16px rgba(225,29,72,.15)}
.unit-card.selected{border-color:#e11d48;background:#fff1f2;box-shadow:0 4px 16px rgba(225,29,72,.2)}
.unit-name{font-size:16px;font-weight:800;color:#e11d48}
.unit-desc{font-size:12px;color:#64748b;margin-top:2px}
.unit-stats{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.unit-stat{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.stat-total{background:#fff1f2;color:#e11d48}
.stat-low{background:#fee2e2;color:#dc2626}
.inv-table{width:100%;border-collapse:collapse}
.inv-table th{background:#e11d48;color:#fff;padding:9px 10px;text-align:left;font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.inv-table th:first-child{border-radius:6px 0 0 0}
.inv-table th:last-child{border-radius:0 6px 0 0}
.inv-table td{border-bottom:1px solid #fff1f2;padding:9px 10px;font-size:12px;color:#1a1a1a;vertical-align:middle}
.inv-table tr:hover td{background:#fff1f2}
.inv-table tr.low-stock td{background:#fff5f5;border-bottom-color:#fecdd3}
.low-badge{display:inline-flex;align-items:center;gap:4px;background:#fff1f2;color:#e11d48;border:1px solid #fecdd3;border-radius:99px;font-size:10px;font-weight:700;padding:2px 8px}
.ok-badge{display:inline-flex;align-items:center;gap:4px;background:#dcfce7;color:#15803d;border-radius:99px;font-size:10px;font-weight:700;padding:2px 8px}
.qty-edit{width:70px;background:#fff;border:1.5px solid #fecdd3;border-radius:5px;color:#1a1a1a;padding:4px 6px;font-size:13px;text-align:center;font-family:inherit}
.qty-edit:focus{outline:none;border-color:#e11d48}
.low-stock-banner{background:linear-gradient(135deg,#fff1f2,#ffe4e6);border:1.5px solid #fda4af;border-radius:10px;padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.low-stock-banner .banner-text{color:#be123c;font-weight:700;font-size:13px}
.low-stock-banner .banner-sub{color:#e11d48;font-size:12px;opacity:.9;margin-top:2px}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(159,18,57,.25);z-index:500;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#modal-overlay.open{display:flex}
#modal{background:#fff;border-radius:14px;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(225,29,72,.2);border-top:4px solid #e11d48}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #fecdd3}
.modal-title{font-size:16px;font-weight:700;color:#e11d48}
.modal-close{background:none;border:none;color:#fda4af;font-size:22px;cursor:pointer}
.modal-close:hover{color:#e11d48}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.info-item{background:#fff1f2;border-radius:6px;padding:8px 10px;border:1px solid #fecdd3}
.info-lbl{font-size:10px;color:#9f1239;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.info-val{font-size:13px;color:#1a1a1a;margin-top:2px;font-weight:600}
.item-table{width:100%;border-collapse:collapse;margin-bottom:16px}
.item-table th{background:#e11d48;color:#fff;padding:8px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.item-table td{border-bottom:1px solid #fff1f2;padding:7px 10px;font-size:12px;color:#1a1a1a;vertical-align:top}
.item-table tr:hover td{background:#fff1f2}
.appr-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
textarea.remark-box{width:100%;background:#fff;border:1.5px solid #fecdd3;border-radius:6px;color:#1a1a1a;padding:8px;font-family:inherit;font-size:13px;resize:vertical;margin-top:8px}
textarea.remark-box:focus{outline:none;border-color:#e11d48}

/* EMPTY */
.empty-state{text-align:center;padding:48px;color:#fda4af}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{color:#94a3b8;font-size:14px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e11d48;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;display:none;box-shadow:0 4px 20px rgba(225,29,72,.35);white-space:nowrap;font-weight:600}
#toast.success{background:#15803d}
#toast.error{background:#be123c}
#toast.info{background:#9f1239}

/* LOADER */
#loader{display:none;position:fixed;inset:0;background:rgba(255,241,242,.85);z-index:800;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#loader.show{display:flex}
.spinner{width:40px;height:40px;border:3px solid #fecdd3;border-top-color:#e11d48;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .form-grid{grid-template-columns:1fr 1fr}
  .cart-hdr,.cart-row{grid-template-columns:24px 1fr 70px 50px 36px;gap:6px}
  .cart-hdr .h-sap,.cart-row .sap-cell,.cart-hdr .h-pn,.cart-row .pn-cell,.cart-hdr .h-rmk,.cart-row .rmk-cell{display:none}
  .info-grid{grid-template-columns:1fr}
  .action-row{flex-direction:column}
  .unit-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>
<div id="toast"></div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">⚙ MR GOT</div>
    <div class="auth-sub">Material Request & Inventory Tracking</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showAuthTab('login')" id="tab-login">Login</button>
      <button class="auth-tab" onclick="showAuthTab('register')" id="tab-register">Register</button>
    </div>
    <div id="login-form">
      <div class="field"><label>Email</label><input class="inp" id="login-email" type="email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="field"><label>Password</label><input class="inp" id="login-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn-primary" onclick="doLogin()">Login</button>
      <div class="auth-err" id="login-err"></div>
    </div>
    <div id="register-form" style="display:none">
      <div class="field"><label>Full Name</label><input class="inp" id="reg-name" placeholder="Your name"></div>
      <div class="field"><label>Email</label><input class="inp" id="reg-email" type="email" placeholder="your@email.com"></div>
      <div class="field"><label>Password</label><input class="inp" id="reg-pass" type="password" placeholder="Min 6 characters"></div>
      <div class="field"><label>Role</label>
        <select class="inp" id="reg-role">
          <option value="requester">Requester (Field / Rig Team)</option>
          <option value="approver">Approver (Supervisor)</option>
          <option value="warehouse">Warehouse</option>
        </select>
      </div>
      <button class="btn-primary" onclick="doRegister()">Create Account</button>
      <div class="auth-err" id="reg-err"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div id="topbar">
    <h1>⚙ MR GOT TRACKING</h1>
    <div class="topbar-right">
      <div>
        <div class="user-name" id="user-display-name"></div>
        <div class="user-role" id="user-display-role"></div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div id="nav"></div>
  <div id="content"></div>
</div>

<!-- MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, getDoc, getDocs, updateDoc, deleteDoc,
  query, where, orderBy, serverTimestamp, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCg6hG3rEvIQL9RbogbNnMtw_6jrT_3sVA",
  authDomain: "mr-got-tracking.firebaseapp.com",
  projectId: "mr-got-tracking",
  storageBucket: "mr-got-tracking.firebasestorage.app",
  messagingSenderId: "536623955752",
  appId: "1:536623955752:web:51471aa826eec22e479a1d"
};
const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);

const showLoader=v=>document.getElementById("loader").classList.toggle("show",v);
let toastTimer;
function toast(msg,type="success"){
  const t=document.getElementById("toast");
  t.textContent=msg;t.className=type;t.style.display="block";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",3000);
}
function hilite(text,q){
  if(!q)return text;
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i===-1)return text;
  return text.slice(0,i)+"<mark>"+text.slice(i,i+q.length)+"</mark>"+text.slice(i+q.length);
}
function fmtDate(ts){
  if(!ts)return "—";
  const d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function statusBadge(s){
  const map={pending:"s-pending",approved:"s-approved",rejected:"s-rejected",fulfilled:"s-fulfilled"};
  return `<span class="status-badge ${map[s]||""}">${s?.toUpperCase()||"—"}</span>`;
}

};

window.doLogout=async function(){

function buildNav(){
  const role=userProfile?.role;
  const tabs=[
    {id:"inventory",label:"📦 Inventory"},
    {id:"new-mr",label:"➕ New MR"},
    {id:"my-mr",label:"📋 My MRs"},
  ];
  if(role==="approver"){
    tabs.push({id:"pending",label:"⏳ Pending"});
    tabs.push({id:"all-mr",label:"📁 All MRs"});
    tabs.push({id:"units",label:"🏢 Manage Units"});
  }
  if(role==="warehouse"){
    tabs.push({id:"approved",label:"✅ Approved"});
  }
  document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="nav-btn" id="nav-${t.id}" onclick="showTab('${t.id}')">${t.label}</button>`).join("");
}
window.showTab=function(tab){
  currentTab=tab;
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  const btn=document.getElementById("nav-"+tab);
  if(btn)btn.classList.add("active");
  unsubscribes.forEach(u=>u());unsubscribes=[];
  document.getElementById("content").innerHTML="";
  if(tab==="inventory")renderInventory();
  else if(tab==="new-mr")renderNewMR();
  else if(tab==="my-mr")renderMyMRs();
  else if(tab==="pending")renderPendingMRs();
  else if(tab==="all-mr")renderAllMRs();
  else if(tab==="approved")renderApprovedMRs();
  else if(tab==="units")renderManageUnits();
};

async function renderInventory(){
  document.getElementById("content").innerHTML=`
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div class="section-title" style="margin:0">📦 Unit Inventory</div>
        <input class="inp" id="unit-search" placeholder="Search unit..." style="width:200px" oninput="filterUnits()">
      </div>
      <div id="unit-grid" class="unit-grid"></div>
    </div>
    <div id="inv-detail" style="display:none"></div>`;

  // load units real-time
  const unsub=onSnapshot(collection(db,"units"),snap=>{
    const units=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
    window._allUnits=units;
    renderUnitGrid(units);
    // if one was selected, refresh its detail
    if(selectedUnitId){
      const u=units.find(u=>u.id===selectedUnitId);
      if(u)renderInvDetail(u);
    }
  });
  unsubscribes.push(unsub);
}

window.filterUnits=function(){
  const q=document.getElementById("unit-search")?.value.toLowerCase()||"";
  const filtered=(window._allUnits||[]).filter(u=>u.name.toLowerCase().includes(q)||u.description?.toLowerCase().includes(q));
  renderUnitGrid(filtered);
};

function renderUnitGrid(units){
  const grid=document.getElementById("unit-grid");
  if(!grid)return;
  if(!units.length){grid.innerHTML='<div style="color:#64748b;font-size:13px;padding:16px">No units found.</div>';return;}
  grid.innerHTML=units.map(u=>{
    const lowCount=(u.inventory||[]).filter(i=>i.qtyOnHand<i.minQty).length;
    const totalItems=(u.inventory||[]).length;
    return `<div class="unit-card${selectedUnitId===u.id?" selected":""}" onclick="selectUnit('${u.id}')">
      <div class="unit-name">${u.name}</div>
      <div class="unit-desc">${u.description||"No description"}</div>
      <div class="unit-stats">
        <span class="unit-stat stat-total">${totalItems} items</span>
        ${lowCount>0?`<span class="unit-stat stat-low">⚠ ${lowCount} low</span>`:""}
      </div>
    </div>`;
  }).join("");
}

window.selectUnit=function(id){
  selectedUnitId=id;
  // refresh unit grid selection highlight
  document.querySelectorAll(".unit-card").forEach(c=>c.classList.remove("selected"));
  const card=document.querySelector(`.unit-card[onclick="selectUnit('${id}')"]`);
  if(card)card.classList.add("selected");
  const unit=(window._allUnits||[]).find(u=>u.id===id);
  if(unit)renderInvDetail(unit);
};

function renderInvDetail(unit){
  const detail=document.getElementById("inv-detail");
  if(!detail)return;
  detail.style.display="block";

  const inv=unit.inventory||[];
  const lowItems=inv.filter(i=>i.qtyOnHand<i.minQty);
  const role=userProfile?.role;

  detail.innerHTML=`
    ${lowItems.length>0?`
    <div class="low-stock-banner">
      <div>
        <div class="banner-text">⚠ ${lowItems.length} item${lowItems.length>1?"s":""} below minimum stock in ${unit.name}</div>
        <div class="banner-sub">${lowItems.map(i=>i.description).join(", ")}</div>
      </div>
      <button class="btn-danger" onclick="createMRFromLowStock('${unit.id}')">📋 Create MR from Low Stock</button>
    </div>`:""}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <div>
          <div class="section-title" style="margin:0">${unit.name} — Inventory</div>
          <div style="font-size:12px;color:#64748b;margin-top:2px">${unit.description||""}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input class="inp" id="inv-search" placeholder="Search item..." style="width:180px" oninput="filterInvTable('${unit.id}')">
          <button class="btn-sm btn-sm-yellow" onclick="openAddItemModal('${unit.id}')">+ Add Item</button>
          <button class="btn-sm btn-sm-green" onclick="saveAllQty('${unit.id}')">💾 Save Changes</button>
          <button class="btn-sm btn-sm-blue" onclick="exportInvExcel('${unit.id}')">📊 Export</button>
        </div>
      </div>
      ${inv.length===0?`<div class="empty-state"><div class="icon">📦</div><p>No items yet. Click "+ Add Item" to start.</p></div>`:`
      <div style="overflow-x:auto">
      <table class="inv-table" id="inv-table-${unit.id}">
        <thead><tr>
          <th>#</th><th>Description</th><th>SAP No.</th><th>P/N</th><th>Category</th>
          <th style="text-align:center">Qty On Hand</th>
          <th style="text-align:center">Min. Qty</th>
          <th style="text-align:center">Status</th>
          <th style="text-align:center">Action</th>
        </tr></thead>
        <tbody id="inv-tbody-${unit.id}">
          ${inv.map((item,i)=>invRow(unit.id,item,i)).join("")}
        </tbody>
      </table>
      </div>`}
    </div>`;
}

function invRow(unitId,item,i){
  const isLow=item.qtyOnHand<item.minQty;
  return `<tr class="${isLow?"low-stock":""}" id="inv-row-${unitId}-${item.dbId}">
    <td class="seq">${i+1}</td>
    <td><div style="font-weight:600;font-size:12px">${item.description}</div></td>
    <td style="color:#94a3b8;font-size:11px">${item.sap_number||"—"}</td>
    <td style="color:#94a3b8;font-size:11px">${item.part_number||"—"}</td>
    <td><span style="color:${getCatColor(item.category)};font-size:11px">${getCatLabel(item.category)}</span></td>
    <td style="text-align:center">
      <input class="qty-edit" type="number" min="0" value="${item.qtyOnHand}" id="qty-${unitId}-${item.dbId}" onchange="updateRowStatus('${unitId}','${item.dbId}',this.value,${item.minQty})">
    </td>
    <td style="text-align:center">
      <input class="qty-edit" type="number" min="0" value="${item.minQty}" id="min-${unitId}-${item.dbId}">
    </td>
    <td style="text-align:center">
      ${isLow?`<span class="low-badge">⚠ LOW</span>`:`<span class="ok-badge">✓ OK</span>`}
    </td>
    <td style="text-align:center">
      <button class="btn-sm btn-sm-red" onclick="removeInvItem('${unitId}','${item.dbId}')" title="Remove">✕</button>
    </td>
  </tr>`;
}

window.filterInvTable=function(unitId){
  const q=document.getElementById("inv-search")?.value.toLowerCase()||"";
  const unit=(window._allUnits||[]).find(u=>u.id===unitId);
  if(!unit)return;
  const tbody=document.getElementById(`inv-tbody-${unitId}`);
  if(!tbody)return;
  const inv=unit.inventory||[];
  const filtered=q?inv.filter(i=>i.description.toLowerCase().includes(q)||i.sap_number?.toLowerCase().includes(q)||i.part_number?.toLowerCase().includes(q)):inv;
  tbody.innerHTML=filtered.map((item,i)=>invRow(unitId,item,i)).join("");
};

window.updateRowStatus=function(unitId,dbId,newQty,minQty){
  const row=document.getElementById(`inv-row-${unitId}-${dbId}`);
  if(!row)return;
  const isLow=parseInt(newQty)<parseInt(minQty);
  row.classList.toggle("low-stock",isLow);
  const statusCell=row.querySelector(".low-badge, .ok-badge");
  if(statusCell)statusCell.outerHTML=isLow?'<span class="low-badge">⚠ LOW</span>':'<span class="ok-badge">✓ OK</span>';
};

window.saveAllQty=async function(unitId){
  const unit=(window._allUnits||[]).find(u=>u.id===unitId);
  if(!unit)return;
  showLoader(true);
  try{
    const inv=(unit.inventory||[]).map(item=>{
      const qtyEl=document.getElementById(`qty-${unitId}-${item.dbId}`);
      const minEl=document.getElementById(`min-${unitId}-${item.dbId}`);
      return{...item,
        qtyOnHand:qtyEl?parseInt(qtyEl.value)||0:item.qtyOnHand,
        minQty:minEl?parseInt(minEl.value)||0:item.minQty
      };
    });
    await updateDoc(doc(db,"units",unitId),{inventory:inv,updatedAt:serverTimestamp()});
    toast("Inventory saved ✓");
  }catch(e){toast("Error: "+e.message,"error");}
  showLoader(false);
};

window.removeInvItem=async function(unitId,dbId){
  if(!confirm("Remove this item from inventory?"))return;
  const unit=(window._allUnits||[]).find(u=>u.id===unitId);
  if(!unit)return;
  showLoader(true);
  try{
    const inv=(unit.inventory||[]).filter(i=>i.dbId!==dbId);
    await updateDoc(doc(db,"units",unitId),{inventory:inv,updatedAt:serverTimestamp()});
    toast("Item removed");
  }catch(e){toast("Error: "+e.message,"error");}
  showLoader(false);
};

  // build cat pills for modal

  allBtn.className="cat-pill active";allBtn.textContent="ALL";
  allBtn.style.cssText="color:#94a3b8;border-color:#334155";
  allBtn.onclick=()=>{activeCatInv="ALL";setInvCat("ALL");};

      const bc=b.getAttribute("data-cat")||"ALL";

window.renderInvItemDropdown=function(unitId,activeCatInv="ALL"){
  const si=document.getElementById("inv-item-search");
  const dd=document.getElementById("inv-dropdown");
  if(!si||!dd)return;
  const q=si.value.trim().toLowerCase();
  const results=DB.filter(item=>{
    const mc=activeCatInv==="ALL"||item.category===activeCatInv;
    const mq=!q||item.description.toLowerCase().includes(q)||item.sap_number.toLowerCase().includes(q)||item.part_number.toLowerCase().includes(q);
    return mc&&mq;
  }).slice(0,40);
  if(!results.length){dd.innerHTML='<div style="padding:12px;text-align:center;color:#64748b;font-size:13px">No items found</div>';dd.style.display="block";return;}
  dd.innerHTML=results.map(item=>`
    <div class="drop-item" data-id="${item.id}" onmousedown="selectInvItem(${item.id})">
      <div class="cat-dot" style="background:${getCatColor(item.category)}"></div>
      <div>
        <div class="drop-desc">${hilite(item.description,si.value.trim())}</div>
        <div class="drop-meta">${item.sap_number?`SAP: ${item.sap_number} `:""} ${item.part_number?`P/N: ${item.part_number} `:""}<span style="color:${getCatColor(item.category)}">· ${getCatLabel(item.category)}</span></div>
      </div>
    </div>`).join("");
  dd.style.display="block";
};

window.selectInvItem=function(id){
  const item=DB.find(d=>d.id===id);
  if(!item)return;
  window._selectedInvItem=item;
  const el=document.getElementById("inv-selected-item");
  if(el)el.innerHTML=`<span style="color:#f59e0b;font-weight:700">Selected:</span> ${item.description}<br><span style="color:#64748b">${item.sap_number?`SAP: ${item.sap_number} `:""}${item.part_number?`P/N: ${item.part_number}`:""}  · ${getCatLabel(item.category)}</span>`;
  const si=document.getElementById("inv-item-search");
  if(si)si.value=item.description;
};

window.confirmAddInvItem=async function(unitId){
  const qty=parseInt(document.getElementById("inv-add-qty")?.value)||0;
  const minQty=parseInt(document.getElementById("inv-add-min")?.value)||1;
  const unit=(window._allUnits||[]).find(u=>u.id===unitId);
  if(!unit){toast("Unit not found","error");return;}

  let newItem;
  if(window._selectedInvItem){
    const item=window._selectedInvItem;
    // Check duplicate
    if((unit.inventory||[]).some(i=>i.dbId===String(item.id))){toast("Item already in inventory","error");return;}
    newItem={dbId:String(item.id),description:item.description,sap_number:item.sap_number||"",part_number:item.part_number||"",category:item.category,unit:item.unit||"",qtyOnHand:qty,minQty};
  } else {
    toast("Select an item from the search","error");return;
  }

  showLoader(true);
  try{
    const inv=[...(unit.inventory||[]),newItem];
    await updateDoc(doc(db,"units",unitId),{inventory:inv,updatedAt:serverTimestamp()});
    toast("Item added to inventory ✓");
    closeModal();
  }catch(e){toast("Error: "+e.message,"error");}
  showLoader(false);
};

// Create MR from low stock items
window.createMRFromLowStock=function(unitId){
  const unit=(window._allUnits||[]).find(u=>u.id===unitId);
  if(!unit)return;
  const lowItems=(unit.inventory||[]).filter(i=>i.qtyOnHand<i.minQty);
  if(!lowItems.length){toast("No low stock items","info");return;}

  // Pre-fill cart with low stock items
  cart=lowItems.map(item=>({
    item:{id:parseInt(item.dbId)||0,description:item.description,sap_number:item.sap_number||"",part_number:item.part_number||"",category:item.category,unit:item.unit||""},
    qty:Math.max(1,item.minQty-item.qtyOnHand),
    remark:`Low stock: ${item.qtyOnHand}/${item.minQty} min`
  }));

  toast(`${lowItems.length} low stock items added to MR cart ✓`,"info");
  showTab("new-mr");
};

// Export inventory to Excel
window.exportInvExcel=function(unitId){
  const unit=(window._allUnits||[]).find(u=>u.id===unitId);
  if(!unit)return;
  const inv=unit.inventory||[];
  const aoa=[
    [`INVENTORY — ${unit.name}`],
    [unit.description||""],
    [],
    ["#","Description","SAP No.","P/N","Category","Qty On Hand","Min. Qty","Status"],
    ...inv.map((item,i)=>[
      i+1,item.description,item.sap_number||"",item.part_number||"",
      getCatLabel(item.category),item.qtyOnHand,item.minQty,
      item.qtyOnHand<item.minQty?"LOW STOCK":"OK"
    ])
  ];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:4},{wch:45},{wch:14},{wch:16},{wch:16},{wch:12},{wch:10},{wch:10}];
  ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:7}}];
  const wb2=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb2,ws,unit.name);
  XLSX.writeFile(wb2,`Inventory_${unit.name}_${new Date().toISOString().slice(0,10)}.xlsx`);
};

    <div class="field"><label>Description</label><input class="inp" id="unit-desc" placeholder="e.g. Offshore Unit Bravo" value="${description}"></div>

      <button class="btn-green" onclick="saveUnit('${id}')" style="flex:1">${isEdit?"Save Changes":"Create Unit"}</button>
      <button class="btn-gray" onclick="closeModal()" style="flex:1">Cancel</button>
    </div>`;
  document.getElementById("modal-overlay").classList.add("open");
};

window.saveUnit=async function(id){
  const name=document.getElementById("unit-name")?.value.trim();
  const description=document.getElementById("unit-desc")?.value.trim();
  if(!name){toast("Unit name is required","error");return;}
  showLoader(true);
  try{
    if(id){
      await updateDoc(doc(db,"units",id),{name,description,updatedAt:serverTimestamp()});
      toast("Unit updated ✓");
    } else {
      await addDoc(collection(db,"units"),{name,description,inventory:[],createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
      toast("Unit created ✓");
    }
    closeModal();
  }catch(e){toast("Error: "+e.message,"error");}
  showLoader(false);
};

window.deleteUnit=async function(id,name){
  if(!confirm(`Delete unit "${name}"? This will also delete all its inventory data.`))return;
  showLoader(true);
  try{
    await deleteDoc(doc(db,"units",id));
    toast("Unit deleted");
  }catch(e){toast("Error: "+e.message,"error");}
  showLoader(false);
};

function buildCatPills(){
  const cr=document.getElementById("cat-row");if(!cr)return;cr.innerHTML="";
  const ab=document.createElement("button");ab.className="cat-pill active";ab.textContent="ALL";
  ab.style.cssText="color:#94a3b8;border-color:#334155";ab.onclick=()=>setCat("ALL");cr.appendChild(ab);
  Object.entries(CAT_CONFIG).forEach(([key,cfg])=>{
    const b=document.createElement("button");b.className="cat-pill";b.textContent=cfg.label;
    b.style.color=cfg.color;b.setAttribute("data-cat",key);b.onclick=()=>setCat(key);cr.appendChild(b);
  });
}
function setCat(cat){
  activeCat=cat;
  document.querySelectorAll("#cat-row .cat-pill").forEach(b=>{
    const bc=b.getAttribute("data-cat")||"ALL";const a=(cat==="ALL"&&bc==="ALL")||bc===cat;
    b.classList.toggle("active",a);b.style.backgroundColor=a?(bc==="ALL"?"#334155":getCatColor(bc)):"transparent";
    b.style.color=a?"#fff":(bc==="ALL"?"#94a3b8":getCatColor(bc));
  });renderSearch();
}
function wireSearch(){
  const si=document.getElementById("search-input");if(!si)return;
  si.addEventListener("input",()=>{const clr=document.getElementById("search-clear")||si.nextElementSibling;if(clr)clr.style.display=si.value?"block":"none";renderSearch();});
  si.addEventListener("focus",()=>renderSearch());
  si.addEventListener("blur",()=>setTimeout(()=>{const d=document.getElementById("dropdown");if(d)d.style.display="none";},200));
}
window.clearSearch=function(){
  const si=document.getElementById("search-input");const d=document.getElementById("dropdown");
  if(si)si.value="";if(d)d.style.display="none";
  const hint=document.getElementById("search-hint");if(hint)hint.style.display="block";
};
function renderSearch(){
  const si=document.getElementById("search-input");const dd=document.getElementById("dropdown");const hint=document.getElementById("search-hint");
  if(!si||!dd)return;
  const q=si.value.trim();
  if(!q&&activeCat==="ALL"){dd.style.display="none";if(hint)hint.style.display="block";return;}
  if(hint)hint.style.display="none";
  const ql=q.toLowerCase();
  const results=DB.filter(item=>{
    const mc=activeCat==="ALL"||item.category===activeCat;
    const mq=!q||item.description.toLowerCase().includes(ql)||item.sap_number.toLowerCase().includes(ql)||item.part_number.toLowerCase().includes(ql)||item.manufacturer.toLowerCase().includes(ql);
    return mc&&mq;
  }).slice(0,60);
  if(!results.length){dd.innerHTML='<div style="padding:12px;text-align:center;color:#64748b">No items found</div>';dd.style.display="block";return;}
  dd.innerHTML=results.map(item=>{
    const ic=cart.some(c=>c.item.id===item.id);
    return `<div class="drop-item${ic?" in-cart":""}" data-id="${item.id}" style="${ic?"background:#0f2a1a":""}">
      <div class="cat-dot" style="background:${getCatColor(item.category)}"></div>
      <div style="flex:1">
        <div class="drop-desc">${hilite(item.description,q)}</div>
        <div class="drop-meta">${item.sap_number?`SAP: ${item.sap_number} `:""}${item.part_number?`P/N: ${item.part_number} `:""}${item.manufacturer&&item.manufacturer!=="LOCAL"?`· ${item.manufacturer} `:""}<span style="color:${getCatColor(item.category)}">· ${getCatLabel(item.category)}</span></div>
      </div>
      <button class="btn-sm ${ic?"btn-sm-green":"btn-sm-yellow"}" style="flex-shrink:0">${ic?"✓ Added":"+ Add"}</button>
    </div>`;
  }).join("");
  dd.querySelectorAll(".drop-item").forEach(el=>{
    el.addEventListener("mousedown",()=>{
      const id=parseInt(el.getAttribute("data-id"));
      const item=DB.find(d=>d.id===id);
      if(item&&!cart.some(c=>c.item.id===id)){cart.push({item,qty:1,remark:""});renderCart();renderSearch();}
    });
  });
  dd.style.display="block";
}
function renderCart(){
  const list=document.getElementById("cart-list");const card=document.getElementById("cart-card");const ar=document.getElementById("action-row");const lbl=document.getElementById("cart-count-label");
  if(!list)return;
  if(!cart.length){if(card)card.style.display="none";return;}
  if(card)card.style.display="block";if(ar)ar.style.display="flex";
  if(lbl)lbl.textContent=`— ${cart.length} item${cart.length>1?"s":""}`;
  list.innerHTML=cart.map((c,i)=>`<div class="cart-row">
    <span class="seq">${i+1}</span>
    <div><div class="cart-desc">${c.item.description}</div><div class="cart-meta-sm"><span style="color:${getCatColor(c.item.category)}">${getCatLabel(c.item.category)}</span>${c.item.unit?` · ${c.item.unit}`:""}</div></div>
    <div class="unit-cell sap-cell">${c.item.sap_number||"—"}</div>
    <div class="unit-cell pn-cell">${c.item.part_number||"—"}</div>
    <div style="text-align:center"><input class="qty-inp" type="number" min="1" value="${c.qty}" onchange="updateQty(${c.item.id},this.value)"></div>
    <div class="rmk-cell"><input class="rmk-inp" placeholder="Remark..." value="${c.remark}" onchange="updateRemark(${c.item.id},this.value)"></div>
    <button class="del-btn" onclick="removeItem(${c.item.id})">✕</button>
  </div>`).join("");
}
window.updateQty=function(id,v){const e=cart.find(c=>c.item.id===id);if(e)e.qty=Math.max(1,parseInt(v)||1);};
window.updateRemark=function(id,v){const e=cart.find(c=>c.item.id===id);if(e)e.remark=v;};
window.removeItem=function(id){cart=cart.filter(c=>c.item.id!==id);renderCart();renderSearch();};

window.submitMR=async function(){
  if(!cart.length){toast("Add items first","error");return;}
  const num=document.getElementById("mr-number")?.value||"";
  if(!num){toast("Enter MR Number first","error");return;}
  showLoader(true);
  try{
    await addDoc(collection(db,"material_requests"),{
      mrNumber:num,date:document.getElementById("mr-date")?.value||"",
      priority:document.getElementById("mr-priority")?.value||"Normal",
      unit:document.getElementById("mr-unit")?.value||"",
      job:document.getElementById("mr-job")?.value||"",
      notes:document.getElementById("mr-notes")?.value||"",
      requestedBy:{uid:currentUser.uid,name:userProfile.name,email:currentUser.email},
      items:cart.map(c=>({id:c.item.id,description:c.item.description,sap_number:c.item.sap_number,part_number:c.item.part_number,unit:c.item.unit,category:c.item.category,qty:c.qty,remark:c.remark})),
      status:"pending",createdAt:serverTimestamp(),updatedAt:serverTimestamp(),approvalRemark:""
    });
    cart=[];toast("MR submitted ✓");showTab("my-mr");
  }catch(e){toast("Error: "+e.message,"error");}
  showLoader(false);
};

// MR LISTS

function mrListPage(title,queryFn){
  document.getElementById("content").innerHTML=`<div class="card"><div class="section-title">${title}</div><div id="mr-list"><div class="empty-state"><div class="icon">⏳</div><p>Loading...</p></div></div></div>`;
  const unsub=onSnapshot(queryFn,snap=>{
    const list=document.getElementById("mr-list");if(!list)return;
    if(snap.empty){list.innerHTML=`<div class="empty-state"><div class="icon">📋</div><p>No MRs found.</p></div>`;return;}
    list.innerHTML=snap.docs.map(d=>mrCard(d.id,d.data())).join("");
  });
  unsubscribes.push(unsub);
}
function renderMyMRs(){mrListPage("📋 My Material Requests",query(collection(db,"material_requests"),where("requestedBy.uid","==",currentUser.uid),orderBy("createdAt","desc")));}
function renderPendingMRs(){mrListPage("⏳ Pending Approval",query(collection(db,"material_requests"),where("status","==","pending"),orderBy("createdAt","desc")));}
function renderAllMRs(){mrListPage("📁 All Material Requests",query(collection(db,"material_requests"),orderBy("createdAt","desc")));}
function renderApprovedMRs(){mrListPage("✅ Approved — Ready to Fulfill",query(collection(db,"material_requests"),where("status","==","approved"),orderBy("createdAt","desc")));}

function mrCard(id,data){
  const pr=data.priority==="Critical"?'<span style="color:#f87171;font-weight:700"> 🔴 CRITICAL</span>':data.priority==="Urgent"?'<span style="color:#fbbf24;font-weight:700"> 🟡 URGENT</span>':"";
  return `<div class="mr-card ${data.status||'pending'}" onclick="openMR('${id}')">
    <div class="mr-top">
      <div><div class="mr-num">${data.mrNumber||"(no number)"}${pr}</div>
        <div class="mr-info">By: ${data.requestedBy?.name||"—"} · ${data.unit||"—"} · ${data.job||"—"} · ${data.items?.length||0} items · ${fmtDate(data.createdAt)}</div></div>
      ${statusBadge(data.status)}
    </div>
    ${data.approvalRemark?`<div style="font-size:11px;color:#64748b;margin-top:6px">Remark: ${data.approvalRemark}</div>`:""}
  </div>`;
}

window.openMR=async function(id){
  showLoader(true);
  const snap=await getDoc(doc(db,"material_requests",id));
  if(!snap.exists()){showLoader(false);toast("Not found","error");return;}
  const data=snap.data();showLoader(false);
  const role=userProfile?.role;
  const canApprove=role==="approver"&&data.status==="pending";
  const canFulfill=role==="warehouse"&&data.status==="approved";
  const itemRows=data.items?.map((item,i)=>`<tr><td style="text-align:center">${i+1}</td><td>${item.description}</td><td style="text-align:center">${item.sap_number||"—"}</td><td style="text-align:center">${item.part_number||"—"}</td><td style="text-align:center">${item.qty}</td><td>${item.unit||""}</td><td>${item.remark||""}</td></tr>`).join("")||"";
  document.getElementById("modal").innerHTML=`
    <div class="modal-header"><div class="modal-title">MR: ${data.mrNumber||"—"} ${statusBadge(data.status)}</div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="info-grid">
      <div class="info-item"><div class="info-lbl">Requested By</div><div class="info-val">${data.requestedBy?.name||"—"}</div></div>
      <div class="info-item"><div class="info-lbl">Date</div><div class="info-val">${data.date||"—"}</div></div>
      <div class="info-item"><div class="info-lbl">Unit / Rig</div><div class="info-val">${data.unit||"—"}</div></div>
      <div class="info-item"><div class="info-lbl">Well / Job</div><div class="info-val">${data.job||"—"}</div></div>
      <div class="info-item"><div class="info-lbl">Priority</div><div class="info-val">${data.priority||"Normal"}</div></div>
      <div class="info-item"><div class="info-lbl">Submitted</div><div class="info-val">${fmtDate(data.createdAt)}</div></div>
    </div>
    ${data.notes?`<div class="info-item" style="margin-bottom:14px"><div class="info-lbl">Notes</div><div class="info-val">${data.notes}</div></div>`:""}
    <table class="item-table"><thead><tr><th>#</th><th>Description</th><th>SAP No.</th><th>P/N</th><th>Qty</th><th>Unit</th><th>Remark</th></tr></thead><tbody>${itemRows}</tbody></table>
    ${data.approvalRemark?`<div class="info-item" style="margin-bottom:12px"><div class="info-lbl">Approval Remark</div><div class="info-val">${data.approvalRemark}</div></div>`:""}
    ${canApprove?`<label class="lbl">Approval Remark (optional)</label><textarea class="remark-box" id="approval-remark" rows="2" placeholder="Add a remark..."></textarea>
      <div class="appr-row" style="margin-top:10px">
        <button class="btn-green" onclick="updateMRStatus('${id}','approved')" style="flex:1">✅ Approve</button>
        <button class="btn-danger" onclick="updateMRStatus('${id}','rejected')" style="flex:1">❌ Reject</button>
        <button class="btn-gray" onclick="closeModal()" style="flex:1">Cancel</button>
      </div>`:""}
    ${canFulfill?`<div class="appr-row" style="margin-top:10px">
        <button class="btn-blue" onclick="updateMRStatus('${id}','fulfilled')" style="flex:1">📦 Mark Fulfilled</button>
        <button class="btn-gray" onclick="closeModal()" style="flex:1">Close</button>
      </div>`:""}
    ${!canApprove&&!canFulfill?`<div class="appr-row" style="margin-top:10px">
        <button class="btn-gray" onclick="closeModal()" style="flex:1">Close</button>
        <button class="btn-excel" onclick="exportMRExcel('${id}')" style="flex:1">📊 Export Excel</button>
      </div>`:""}`;
  document.getElementById("modal-overlay").classList.add("open");
};
window.closeModal=function(e){if(e&&e.target!==document.getElementById("modal-overlay"))return;document.getElementById("modal-overlay").classList.remove("open");};
window.updateMRStatus=async function(id,status){
  const remark=document.getElementById("approval-remark")?.value||"";
  showLoader(true);
  try{
    await updateDoc(doc(db,"material_requests",id),{status,approvalRemark:remark,updatedAt:serverTimestamp(),approvedBy:{uid:currentUser.uid,name:userProfile.name}});
    toast(`MR ${status} ✓`);closeModal();
  }catch(e){toast("Error: "+e.message,"error");}
  showLoader(false);
};

// ── EXPORT / PRINT ────────────────────────────────────────────────────────────
window.exportExcel=function(){
  if(!cart.length)return;
  const num=document.getElementById("mr-number")?.value||"";
  const date=document.getElementById("mr-date")?.value||"";
  const aoa=[["MATERIAL REQUEST"],[],
    ["MR Number:",num,"","Date:",date,"","Priority:",document.getElementById("mr-priority")?.value||""],
    ["Unit:",document.getElementById("mr-unit")?.value||"","","Well/Job:",document.getElementById("mr-job")?.value||"","","By:",userProfile.name],
    [],["#","Description","SAP No.","P/N","Qty","Unit","Category","Remark"],
    ...cart.map((c,i)=>[i+1,c.item.description,c.item.sap_number||"",c.item.part_number||"",c.qty,c.item.unit||"",getCatLabel(c.item.category),c.remark||""])];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:4},{wch:45},{wch:14},{wch:16},{wch:6},{wch:8},{wch:16},{wch:24}];
  ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:7}}];
  const wb2=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb2,ws,"MR");
  XLSX.writeFile(wb2,`MR_${num||"draft"}_${date||"draft"}.xlsx`.replace(/[\\/:*?"<>|]/g,"-"));
};
window.exportMRExcel=async function(id){
  showLoader(true);
  const snap=await getDoc(doc(db,"material_requests",id));
  if(!snap.exists()){showLoader(false);return;}
  const data=snap.data();
  const aoa=[["MATERIAL REQUEST"],[],
    ["MR Number:",data.mrNumber||"","","Date:",data.date||"","","Priority:",data.priority||""],
    ["Unit:",data.unit||"","","Well/Job:",data.job||"","","By:",data.requestedBy?.name||""],
    ["Status:",data.status?.toUpperCase()||""],
    [],["#","Description","SAP No.","P/N","Qty","Unit","Category","Remark"],
    ...data.items.map((item,i)=>[i+1,item.description,item.sap_number||"",item.part_number||"",item.qty,item.unit||"",getCatLabel(item.category),item.remark||""])];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:4},{wch:45},{wch:14},{wch:16},{wch:6},{wch:8},{wch:16},{wch:24}];
  ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:7}}];
  const wb2=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb2,ws,"MR");
  XLSX.writeFile(wb2,`MR_${data.mrNumber||id}.xlsx`.replace(/[\\/:*?"<>|]/g,"-"));
  showLoader(false);
};
window.printMR=function(){
  if(!cart.length)return;
  const num=document.getElementById("mr-number")?.value||"";
  const date=document.getElementById("mr-date")?.value||"";
  const priority=document.getElementById("mr-priority")?.value||"Normal";
  const unit=document.getElementById("mr-unit")?.value||"";

  const w=window.open("","_blank","width=900,height=700");
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MR ${num}</title>
  <style>body{font-family:Arial,sans-serif;font-size:10.5pt;margin:20px}h2{text-align:center;margin-bottom:4px}
  .info{width:100%;border-collapse:collapse;margin-bottom:14px;border:1px solid #999}.info td{padding:5px 10px;border:1px solid #ccc}.lbl{font-weight:700;width:100px}
  table.items{width:100%;border-collapse:collapse;margin-bottom:20px}table.items th{background:#1e3a5f;color:#fff;padding:6px;border:1px solid #ccc}
  .sig{width:100%;margin-top:30px}.sig td{padding:10px;width:33%}.sig-line{border-top:1px solid #000;margin-top:40px;padding-top:4px;font-size:9pt}
  @media print{@page{margin:15mm}}</style></head><body>
  <h2>MATERIAL REQUEST</h2>
  <table class="info">
    <tr><td class="lbl">MR No.</td><td>${num}</td><td class="lbl">Date</td><td>${date}</td><td class="lbl">Priority</td><td><b>${priority}</b></td></tr>
    <tr><td class="lbl">Requested By</td><td>${userProfile.name}</td><td class="lbl">Unit/Rig</td><td>${unit}</td><td class="lbl">Well/Job</td><td>${job}</td></tr>
  </table>
  <table class="items"><thead><tr><th>#</th><th>Description</th><th>SAP No.</th><th>P/N</th><th>Qty</th><th>Unit</th><th>Remark</th></tr></thead><tbody>${rows}</tbody></table>
  <table class="sig"><tr>
    <td><div class="sig-line">Requested by<br><br>${userProfile.name}</div></td>
    <td><div class="sig-line">Checked by<br><br>&nbsp;</div></td>
    <td><div class="sig-line">Approved by<br><br>&nbsp;</div></td>
  </tr></table>
  <script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
};
